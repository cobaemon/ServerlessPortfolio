version: 0.2

env:
  variables:
    DJANGO_SETTINGS_MODULE: "config.settings.prod"
    ENV: "prod"

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - python -B -m scripts.control_platform.cli --validate-policy
      - python -B -m scripts.control_platform.cli --validate-hooks
      - python -B -m scripts.control_platform.cli --validate-githooks
      - python -B -m scripts.control_platform.cli --self-test
      - echo "依存関係のインストールを開始..."
      - pip install --upgrade pip
      - pip install -r requirements.txt
      - pip install aws-sam-cli==1.160.1
      - pip install csscompressor==0.9.5
      # 非退行検証（scripts/measurement/non_regression_check.py, tasks.md 8.5）が
      # template.yaml / bucketpolicy.yaml / dependencies.yaml を構造解析するため PyYAML を
      # ビルド環境へ個別導入する。PyYAML は MIT License（出典: requirements-dev.txt の
      # ライセンス注記、pyyaml==6.0.3）。ビルド専用ツールであり Lambda 配布物
      # （requirements.txt / sam build）へは同梱しない（非配布、requirements-dev.txt と整合）。
      - pip install pyyaml==6.0.3
  pre_build:
    commands:
      - echo "SAMビルドの準備を開始..."
      - |
        case "$ENV" in
          prod)
            DOMAIN_NAME="serverless.portfolio.cobaemon.com"
            DJANGO_SETTINGS_MODULE="config.settings.prod"
            ;;
          staging)
            DOMAIN_NAME="staging.serverless.portfolio.cobaemon.com"
            DJANGO_SETTINGS_MODULE="config.settings.staging"
            ;;
          *)
            echo "Unsupported ENV: $ENV" >&2
            exit 1
            ;;
        esac
        export DOMAIN_NAME
        export DJANGO_SETTINGS_MODULE
      - |
        set +x
        SECRET_ID="${ENV}/portfolio/secret"
        PARAMETER_PREFIX="/${ENV}/portfolio/parameter"
        SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id "$SECRET_ID" --query SecretString --output text)
        export SECRET_JSON
        eval "$(
          python - <<'EOF'
        import json
        import os
        import shlex

        # SMTP 認証情報（EMAIL_HOST_USER / EMAIL_HOST_PASSWORD）は Secrets Manager から
        # 除外した。問い合わせメール送信は Amazon SES 直連携（Contact_Function）へ移行し、
        # SMTP 認証情報をビルド環境・Django 設定へ展開しない（出典: requirements.md R6-3、
        # design.md C4、tasks.md 6.1）。
        required_keys = [
            "DJANGO_SECRET_KEY",
            "GOOGLE_CLIENT_ID",
            "GOOGLE_CLIENT_SECRET",
            "GITHUB_CLIENT_ID",
            "GITHUB_CLIENT_SECRET",
        ]
        secret = json.loads(os.environ["SECRET_JSON"])
        missing = [key for key in required_keys if not secret.get(key)]
        if missing:
            raise SystemExit(f"Missing secret values: {', '.join(missing)}")
        for key in required_keys:
            print(f"export {key}={shlex.quote(str(secret[key]))}")
        EOF
        )"
        unset SECRET_JSON
        export ALLOWED_HOSTS="$(aws ssm get-parameter --name "${PARAMETER_PREFIX}/allowed_hosts" --query Parameter.Value --output text)"
        export CSRF_TRUSTED_ORIGINS="$(aws ssm get-parameter --name "${PARAMETER_PREFIX}/csrf_trusted_origins" --query Parameter.Value --output text)"
        export DEFAULT_FROM_EMAIL="$(aws ssm get-parameter --name "${PARAMETER_PREFIX}/default_from_email" --query Parameter.Value --output text)"
        export DEFAULT_TO_EMAIL="$(aws ssm get-parameter --name "${PARAMETER_PREFIX}/default_to_mail" --query Parameter.Value --output text)"
        export EMAIL_HOST="$(aws ssm get-parameter --name "${PARAMETER_PREFIX}/email_host" --query Parameter.Value --output text)"
        export EMAIL_PORT="$(aws ssm get-parameter --name "${PARAMETER_PREFIX}/email_port" --query Parameter.Value --output text)"
        export EMAIL_USE_TLS="$(aws ssm get-parameter --name "${PARAMETER_PREFIX}/email_use_tls" --query Parameter.Value --output text)"
        export EMAIL_USE_SSL="$(aws ssm get-parameter --name "${PARAMETER_PREFIX}/email_use_ssl" --query Parameter.Value --output text)"
        export LOG_LEVEL="$(aws ssm get-parameter --name "${PARAMETER_PREFIX}/log_level" --query Parameter.Value --output text)"
        # CloudFront 配信ドメイン（bare・スキームなし）。拡張版 render_static（ハッシュベース CSP 生成）は
        # settings.AWS_S3_CUSTOM_DOMAIN（= 環境変数 CLOUDFRONT_DOMAIN_NAME）を必須とし、未設定時は
        # フォールバックせず CommandError で中断する（出典: portfolio/management/commands/render_static.py
        # _resolve_cloudfront_domain、config/settings/prod.py AWS_S3_CUSTOM_DOMAIN、requirements.md R7-5、
        # design.md C6/C9）。collectstatic の静的URL生成と render_static を同一ストレージ設定で一貫させるため
        # ビルド全体へ供給する。値は Parameter Store（既存 config と同じ非ハードコード方式）から取得する。
        export CLOUDFRONT_DOMAIN_NAME="$(aws ssm get-parameter --name "${PARAMETER_PREFIX}/cloudfront_domain_name" --query Parameter.Value --output text)"
        echo "Loaded build configuration for $ENV without printing secret values."
      - python manage.py check --fail-level WARNING
      # デプロイ後非退行検証（構成検証段, R9-7）を既存検証段（check --fail-level WARNING,
      # Control Platform self-test）へ接続する。HTTPS 強制・S3 OAC 経由のみ・7 言語表示配信・
      # Contact_Payload 4 項目限定・CSP 付与を IaC（template.yaml/bucketpolicy.yaml/
      # dependencies.yaml）と Django 設定から決定的に検証し、不適合が 1 件でもあれば非ゼロ終了で
      # ビルドを失敗させる（check --fail-level WARNING と同じ段階的失敗方針。出典:
      # scripts/measurement/non_regression_check.py、design.md C9、tasks.md 8.5、requirements.md R9-7）。
      # 実配信エンドポイント実測（--base-url）は DNS 切替後の運用手順のため本段では行わない
      # （design.md「移行手順」/Notes）。未指定時の実測次元は undetermined として記録され失敗させない。
      - python -m scripts.measurement.non_regression_check
      # env_vars.txt が存在しない場合に備えて初期化
      - echo "EXISTING_ARECORD=false" > env_vars.txt
      
      # 既存のRoute53 Aレコードを検出
      - echo "既存のRoute53 Aレコードを検出中..."
      - |
        ROOT_DOMAIN=$(echo $DOMAIN_NAME | awk -F'.' '{print $(NF-1)"."$NF}')
        HOSTED_ZONE_ID=$(aws route53 list-hosted-zones-by-name \
          --dns-name "$ROOT_DOMAIN" \
          --query 'HostedZones[0].Id' --output text | awk -F/ '{print $3}')

        if [ -z "$HOSTED_ZONE_ID" ] || [ "$HOSTED_ZONE_ID" = "None" ]; then
          echo "Hosted zone not found for $ROOT_DOMAIN" >&2
          exit 1
        fi

        echo "HOSTED_ZONE_ID=$HOSTED_ZONE_ID" >> env_vars.txt

        STACK_NAME="cobaemon-serverless-portfolio-${ENV}-stack"
        if [ "$ENV" = "prod" ]; then
          STACK_NAME="cobaemon-serverless-portfolio-stack"
        fi
        CFN_RECORD=$(aws cloudformation describe-stack-resource \
          --stack-name $STACK_NAME \
          --logical-resource-id ApiGatewayRecordSet \
          --query 'StackResourceDetail.PhysicalResourceId' \
          --output text 2>/dev/null || true)

        if [ "$CFN_RECORD" != "None" ] && [ -n "$CFN_RECORD" ]; then
          echo "Stack already manages A record: $CFN_RECORD"
          echo "EXISTING_ARECORD=false" >> env_vars.txt
        else
          EXISTING_RECORD=$(aws route53 list-resource-record-sets \
            --hosted-zone-id $HOSTED_ZONE_ID \
            --query "ResourceRecordSets[?Name=='$DOMAIN_NAME.' && Type=='A']" \
            --output text)

          if [ -n "$EXISTING_RECORD" ]; then
            echo "A record exists outside CloudFormation: $DOMAIN_NAME"
            echo "EXISTING_ARECORD=true" >> env_vars.txt
          else
            echo "No existing A record found. It will be created by the stack."
            echo "EXISTING_ARECORD=false" >> env_vars.txt
          fi
        fi
      
      # 多言語対応のため、翻訳カタログの更新漏れを検出してからコンパイルする
      - echo "翻訳カタログの更新漏れ確認とコンパイルを開始..."
      - |
        if [ ! -d "locale" ]; then
          echo "locale directory is missing." >&2
          exit 1
        fi

        LOCALE_BEFORE_DIR="$(mktemp -d)"
        trap 'rm -rf "$LOCALE_BEFORE_DIR"' EXIT
        cp -R locale "$LOCALE_BEFORE_DIR/locale"

        python manage.py makemessages -a --ignore=venv --ignore=.venv --ignore=node_modules

        python - "$LOCALE_BEFORE_DIR/locale" locale <<'EOF'
        from pathlib import Path
        import sys

        IGNORED_PREFIXES = (
            "#:",
            '"POT-Creation-Date:',
        )

        def normalized_po_text(path):
            """Return PO text without generated source locations or timestamps."""
            return "\n".join(
                line
                for line in path.read_text(encoding="utf-8").splitlines()
                if not line.startswith(IGNORED_PREFIXES)
            )

        before_root = Path(sys.argv[1])
        after_root = Path(sys.argv[2])
        before_files = {
            path.relative_to(before_root): normalized_po_text(path)
            for path in before_root.rglob("*.po")
        }
        after_files = {
            path.relative_to(after_root): normalized_po_text(path)
            for path in after_root.rglob("*.po")
        }

        changed_paths = sorted(
            set(before_files).symmetric_difference(after_files)
            | {
                path
                for path in set(before_files).intersection(after_files)
                if before_files[path] != after_files[path]
            }
        )

        if changed_paths:
            print("Translation catalog files are not up to date.", file=sys.stderr)
            for path in changed_paths:
                print(f"- {path}", file=sys.stderr)
            raise SystemExit(1)
        EOF

        rm -rf locale
        cp -R "$LOCALE_BEFORE_DIR/locale" locale
        python manage.py compilemessages
        
      - python scripts/generate_static_assets.py

      # 静的ファイルの収集（Django 静的アセット）を行う
      - python manage.py collectstatic --noinput
      # 7 言語フルページ静的化（render_static）→ 全言語成功時のみ S3 同期。
      # render_static は settings.LANGUAGES（ja, en, fr, es, ru, zh-hans, ar）を
      # 事前レンダリングし、いずれかの言語で生成失敗すると CommandError で非ゼロ終了する
      # （出典: portfolio/management/commands/render_static.py、design.md C2/C9、R3-6）。
      # `&&` 連結により、全言語の生成が成功した場合にのみ aws s3 sync を実行する。
      # これにより部分同期を行わず、既存の配信状態を保全する（部分同期しない、R3-2/R3-6）。
      - echo "7 言語の表示ページを事前レンダリングし、成功時のみ S3 へ同期します..."
      - |
        BUCKET_NAME="cobaemon-serverless-portfolio-${ENV}-static"
        python manage.py render_static \
          && echo "全言語の Prerendered_Page 生成に成功しました。静的ファイルをS3に同期中..." \
          && aws s3 sync staticfiles/ s3://${BUCKET_NAME}/ --delete
  build:
    commands:
      - echo "SAMビルドを実行中..."
      - sam build --use-container
  post_build:
    commands:
      - echo "SAMパッケージングを実行中..."
      # 環境変数を読み込み
      - if [ -f env_vars.txt ]; then . ./env_vars.txt; fi
      - 'echo "EXISTING_ARECORD: $EXISTING_ARECORD"'
      - sam package --output-template-file packaged.yaml --s3-bucket $S3Bucket
      # パラメータファイルを作成
      - |
        cat > parameters.json <<EOF
        {
          "Parameters": {
            "Env": "$ENV",
            "ExistingARecord": "$EXISTING_ARECORD",
            "HostedZoneId": "$HOSTED_ZONE_ID",
            "DomainName": "$DOMAIN_NAME",
            "AllowedOrigin": "/${ENV}/portfolio/parameter/csrf_trusted_origins",
            "AllowedHosts": "/${ENV}/portfolio/parameter/allowed_hosts",
            "SesVerifiedIdentity": "/${ENV}/portfolio/parameter/ses_verified_identity"
          }
        }
        EOF
      # render_static が生成した統一 CSP（全 Prerendered_Page のインライン sha256 の和集合＋
      # 現行許可元＋CloudFront ドメインを包含。nonce 不在）を parameters.json の
      # ContentSecurityPolicy へ注入する。これにより CloudFront ResponseHeadersPolicy
      # （template.yaml DisplayResponseHeadersPolicy の !Ref ContentSecurityPolicy）が
      # ハッシュ入りの完全な CSP を配信する（出典: design.md C5/C6、requirements.md R7-2/R7-5、
      # portfolio/management/commands/render_static.py の manifest['content_security_policy']）。
      # マニフェスト欠落や CSP 未生成はフォールバックせず非ゼロ終了で明示失敗させる。
      - |
        python - <<'EOF'
        import json

        # collectstatic/render_static が STATIC_ROOT=staticfiles/ に書き出した
        # 統一 CSP マニフェストを読み込む（出典: render_static _MANIFEST_RELATIVE）。
        with open("staticfiles/prerender_manifest.json", encoding="utf-8") as manifest_file:
            manifest = json.load(manifest_file)
        csp = manifest.get("content_security_policy")
        # 統一 CSP が無い/空はビルド不整合として握りつぶさず失敗させる（フォールバック禁止）。
        if not csp:
            raise SystemExit(
                "prerender_manifest.json に content_security_policy がありません"
                "（render_static の統一 CSP 生成を確認してください）。"
            )
        with open("parameters.json", encoding="utf-8") as params_file:
            params = json.load(params_file)
        # CloudFront へ供給する CSP を上書き注入する（template Default の下限を置換）。
        params["Parameters"]["ContentSecurityPolicy"] = csp
        with open("parameters.json", "w", encoding="utf-8") as params_file:
            json.dump(params, params_file, ensure_ascii=False, indent=2)
        print("ContentSecurityPolicy を parameters.json へ注入しました。")
        EOF
      - echo "パラメータファイルを作成しました:"
      - cat parameters.json
      # バケットポリシー用のパラメータファイルを作成
      - |
        cat > bucketpolicy-parameters.json <<EOF
        {
          "Parameters": {
            "Env": "$ENV"
          }
        }
        EOF
      - echo "バケットポリシーパラメータファイルを作成しました:"
      - cat bucketpolicy-parameters.json

artifacts:
  files:
    - packaged.yaml
    - parameters.json
    - bucketpolicy.yaml
    - bucketpolicy-parameters.json
